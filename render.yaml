services:
  # Runs the Express API. Also runs the BullMQ workers (metrics collection,
  # root-cause agent, backup validation) in the same process via
  # RUN_WORKER_IN_PROCESS=true, since Render's free plan doesn't offer a
  # separate background-worker service tier. Set that env var to "false" (and
  # deploy dbgenie-worker as its own paid background_worker service) if this
  # ever moves to a paid plan.
  - type: web
    name: dbgenie-api
    env: node
    plan: free
    buildCommand: npm install && npm run build -w shared && npm run build -w backend
    startCommand: npm run start -w backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SECRETS_ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: NEON_API_KEY
        sync: false
      - key: AUDIT_DB_ROLE_PASSWORD
        sync: false
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      - key: REDIS_URL
        fromService:
          name: dbgenie-redis
          type: redis
          property: connectionString

  - type: web
    name: dbgenie-frontend
    env: static
    buildCommand: npm install && npm run build -w shared && npm run build -w frontend
    staticPublishPath: frontend/dist
    envVars:
      # Set to dbgenie-api's public URL. Vite bakes this in at build time,
      # so changing it requires a redeploy of this service, not just the API.
      - key: VITE_API_BASE_URL
        sync: false

  - type: redis
    name: dbgenie-redis
    plan: free
    ipAllowList: []
